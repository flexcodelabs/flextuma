spring.application.name=${SPRING_APPLICATION_NAME:flextuma}

spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${HIKARI_CONN_TIMEOUT:20000}
logging.config=${LOGGING_CONFIG:classpath:logback-spring.xml}
spring.output.ansi.enabled=${SPRING_OUTPUT_ANSI_ENABLED:ALWAYS}
spring.devtools.restart.enabled=${SPRING_DEVTOOLS_RESTART_ENABLED:true}

# Enable INFO logging to see startup and seeding
logging.level.com.flexcodelabs.flextuma=${LOG_LEVEL_FLEXTUMA:INFO}
logging.level.org.springframework.boot.autoconfigure=${LOG_LEVEL_SPRING_BOOT_AUTOCONFIGURE:INFO}
logging.level.com.flexcodelabs.flextuma.core.config.RequestLoggingFilter=${LOG_LEVEL_REQUEST_LOGGING_FILTER:DEBUG}

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=${SPRING_DATA_REDIS_REPOSITORIES_ENABLED:false}

server.servlet.session.timeout=${SESSION_TIMEOUT:30m}

spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

spring.jpa.properties.hibernate.default_batch_fetch_size=${BATCH_SIZE:100}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LEVEL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${HIBERNATE_BINDER_LEVEL:WARN}
logging.level.org.springframework.orm.jpa=${JPA_LEVEL:WARN}
logging.level.org.springframework.transaction=${TRANSACTION_LEVEL:WARN}
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=${SQL_EXCEPTION_HELPER_LEVEL:WARN}

# Disable verbose Spring exception resolver logs
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=${LOG_LEVEL_SPRING_EXCEPTION_HANDLER_RESOLVER:WARN}

# Disable Hibernate constraint violation warnings
logging.level.org.hibernate.orm.jdbc.warn=${HIBERNATE_JDBC_WARN_LEVEL:ERROR}

# Clean up Spring Boot logging format
logging.pattern.console=${LOG_CONSOLE_PATTERN:%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n}

# Disable specific verbose loggers
logging.level.org.apache.catalina.core=${LOG_LEVEL_CATALINA_CORE:WARN}
logging.level.org.apache.catalina=${LOG_LEVEL_CATALINA:WARN}
logging.level.org.springframework.boot=${LOG_LEVEL_SPRING_BOOT:WARN}
logging.level.org.springframework.web=${LOG_LEVEL_SPRING_WEB:WARN}

spring.web.error.include-message=${ERROR_INCLUDE_MESSAGE:always}

# SMS Pricing
flextuma.sms.price-per-segment=${SMS_PRICE_PER_SEGMENT:20.0}

# Beem delivery reports
flextuma.sms.beem.delivery-poll-interval-ms=${FLEXTUMA_SMS_BEEM_DELIVERY_POLL_INTERVAL_MS:60000}
flextuma.sms.beem.delivery-minimum-delay-minutes=${FLEXTUMA_SMS_BEEM_DELIVERY_MINIMUM_DELAY_MINUTES:5}

# App Upload Directories
flextuma.app.upload.directory=${APP_UPLOAD_DIRECTORY:/tmp/apps}
flextuma.app.frontend.directory=${APP_FRONTEND_DIRECTORY:/tmp/frontend}

# Frontend Static Files - Completely disabled to use custom FrontendController
spring.web.resources.add-mappings=${SPRING_WEB_RESOURCES_ADD_MAPPINGS:false}
spring.web.resources.static-locations=${SPRING_WEB_RESOURCES_STATIC_LOCATIONS:}
spring.mvc.static-path-pattern=${SPRING_MVC_STATIC_PATH_PATTERN:/**}

# System Logging
flextuma.logging.min-level=${LOG_MIN_LEVEL:WARN}
flextuma.logging.retention-days=${LOG_RETENTION_DAYS:30}
flextuma.logging.batch-size=${LOG_BATCH_SIZE:50}
flextuma.logging.flush-interval-ms=${LOG_FLUSH_INTERVAL:2000}
